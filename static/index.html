<!DOCTYPE html>
<html>

<head>
    <title>KittyCam</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: black;
            overflow: hidden;
            font-family: sans-serif;
            color: white;
        }

        #camera {
            width: 100vw;
            height: 100vh;
            object-fit: contain;
            display: block;
            background: black;
        }

        #controls {
            position: fixed;
            top: 15px;
            left: 15px;
            z-index: 10;

            background: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 8px;
        }

        button {
            font-size: 18px;
            padding: 8px 14px;
            cursor: pointer;
        }

        #fps {
            margin-top: 8px;
            font-size: 18px;
        }

        /* Hide controls while fullscreen unless mouse is moved */
        body:fullscreen #controls {
            opacity: 0;
            transition: opacity 0.3s;
        }

        body:fullscreen:hover #controls {
            opacity: 1;
        }
    </style>
</head>

<body>

    <div id="controls">
        <button id="fullscreen-btn">
            Fullscreen
        </button>

        <div id="fps">
            FPS: 0
        </div>
    </div>


    <img id="camera" src="/stream">


    <script>
        const img = document.getElementById("camera");
        const fpsText = document.getElementById("fps");
        const fullscreenButton = document.getElementById("fullscreen-btn");


        // FPS counter based on actual browser image updates
        let frames = 0;
        let last = performance.now();

        img.onload = () => {
            frames++;

            const now = performance.now();

            if (now - last >= 1000) {
                fpsText.innerText = `FPS: ${frames}`;
                frames = 0;
                last = now;
            }
        };


        // Full webpage fullscreen
        fullscreenButton.onclick = async () => {
            try {
                await document.documentElement.requestFullscreen();
            } catch (err) {
                console.error("Fullscreen failed:", err);
            }
        };


        // Double-click image for fullscreen
        img.ondblclick = async () => {
            try {
                await document.documentElement.requestFullscreen();
            } catch (err) {
                console.error("Fullscreen failed:", err);
            }
        };
    </script>

</body>

</html>
