services:
  kittycam-server:
    build: ./cam
    expose:
      - "8000"
    devices:
      - /dev/video0:/dev/video0
    secrets:
      - pushover_token

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped

    command: tunnel run

    volumes:
      - ./cloudflared:/etc/cloudflared

    depends_on:
      - kittycam-server

secrets:
  pushover_token:
    file: ./cam/.env
