<!DOCTYPE html>
<html>

<head>
    <title>KittyCam</title>
    <style>
        body {
            background: #111;
            color: white;
            font-family: sans-serif;
        }

        img {
            max-width: 100%;
        }
    </style>
</head>

<body>

    <h1>KittyCam</h1>

    <div id="fps">FPS: 0</div>

    <img id="camera" src="/stream">

    <script>
        const img = document.getElementById("camera");
        const fps = document.getElementById("fps");

        let frames = 0;
        let last = performance.now();

        img.onload = () => {
            frames++;

            const now = performance.now();

            if (now - last >= 1000) {
                fps.innerText = `FPS: ${frames}`;
                frames = 0;
                last = now;
            }
        };
    </script>

</body>

</html>
